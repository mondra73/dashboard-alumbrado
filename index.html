<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Alumbrado Público</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div id="contenedor">
        <aside id="sidebar">
            <h2>Alumbrado Público</h2>
            <div id="info-actualizacion"></div>
            <div id="buscador">
                <input type="text" id="input-busqueda" placeholder="Buscar por dirección o ID...">
                <ul id="resultados-busqueda"></ul>
            </div>
            <div id="leyenda"></div>
        </aside>
        <main id="mapa"></main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
